# Сопоставление полей спеки с каноническими полями Space Payments (PLAN §5, правила — docs/IR_CONTRACT.md §2.3),
# роли параметров, сигналы единиц суммы, условная обязательность, способы выплаты, поля вебхука.
# Имя поля нормализуется в snake_case (camelCase, kebab-case, пробелы) и сравнивается с синонимами точно.
version: 1

# Порядок разрешения (IR_CONTRACT §2.3): override -> ребёнок сопоставленного контейнера (children, иначе
# <container>.<name> с container_child) -> точный синоним верхнего уровня (с учётом scope и request_synonyms)
# -> плоский реквизит/ошибка (flat) -> суффикс *_id для provider_operation_id (только response/webhook)
# -> canonical nil (W403 для required request-полей).
confidence:
  exact: 1.0
  flat_requisite: 0.8
  suffix: 0.8
  context: 0.8            # code/message без префикса в error-ответе или payload вебхука
  container_child: 0.5
  override: 1.0

canonical:
  amount:
    synonyms: [amount, sum, money, amount_value, total_amount, payout_amount, payment_amount, transfer_amount,
               transaction_amount, order_amount]
    money: true
  currency:
    synonyms: [currency, ccy, cur, currency_code]
  external_id:
    synonyms: [external_id, externalid, order_id, orderid, merchant_order_id, merchant_reference, client_order_id,
               client_reference, reference, custom_id, our_id, merchant_tx_id, merchant_transaction_id, order_number]
    # В теле create-запроса идентификатор операции — это ссылка мерчанта, а не id провайдера.
    request_synonyms: [id, transaction_id, payment_id, payout_id, transfer_id, operation_id, txn_id, tx_id]
  provider_operation_id:
    synonyms: [id, payout_id, payment_id, transfer_id, transaction_id, operation_id, txn_id, tx_id, uuid,
               provider_id, deposit_id, invoice_id, order_uuid, payout_uuid, payment_uuid, transfer_uuid]
    suffixes: [_id, _uuid]
    # Только в ответах, payload вебхука и path-параметрах: в create-запросе id провайдера ещё не существует.
    scope: [response, webhook, parameter]
  merchant_account:
    synonyms: [merchant_id, shop_id, terminal_id, project_id, merchant_login, merchant_account, account_id, partner_id,
               merchant_code]
    credentials_key: merchant_id
  status:
    synonyms: [status, state, payout_status, payment_status, transfer_status, transaction_status, operation_status,
               new_status, current_status, payout_state, payment_state]
    exclude: [old_status, previous_status, prev_status]
  description:
    synonyms: [description, comment, purpose, note, narrative, memo, details_text]
  callback_url:
    synonyms: [callback_url, webhook_url, notify_url, notification_url, callbackurl, ipn_url]
  redirect_url:
    synonyms: [return_url, redirect_url, success_url, fail_url, failure_url, back_url]
  created_at:
    synonyms: [created_at, created, createdat, creation_date, created_date, timestamp, date_created]
  updated_at:
    synonyms: [updated_at, updated, modified_at, last_updated]
  completed_at:
    synonyms: [completed_at, completed, finished_at, processed_at, paid_at, settled_at, executed_at]
  event:
    synonyms: [event, event_type, event_name, notification_type, action, topic]
  balance:
    synonyms: [balance, available, available_balance, available_amount]
    money: true
  hold:
    synonyms: [hold, reserved, frozen, blocked, pending_amount, hold_amount]
    money: true
  fee:
    synonyms: [fee, commission, charge_amount, fee_amount]
    money: true
  # Контейнеры (только для полей type: object / с properties / oneOf): дети получают "<container>.<child>".
  requisite:
    container: true
    synonyms: [recipient, requisite, requisites, destination, beneficiary, payee, receiver, target, account,
               details, payment_details, payout_details, bank_details, card, sbp, wallet, payment_method_details]
    children:
      type: [type, method, kind, payment_method, payout_method, channel, system, payment_system]
      phone: [phone, msisdn, mobile, phone_number, tel, telephone]
      bank_code: [bank_code, bic, bik, bank_bik, bank_id, member_id, bankcode, sbp_bank_id, bank_member_id, swift,
                  swift_code, routing_number, sort_code, ifsc, bsb]
      bank_name: [bank_name, bank]
      card_number: [card_number, pan, cardnumber, card_pan, number]
      account_number: [account_number, account, iban, acc, account_no]
      wallet_id: [wallet_id, purse, wallet_number]
      name: [name, holder, full_name, holder_name, cardholder, card_holder, cardholder_name, card_holder_name,
             recipient_name, beneficiary_name, payee_name, owner]
      first_name: [first_name, firstname, given_name]
      last_name: [last_name, lastname, surname, family_name]
      middle_name: [middle_name, patronymic]
      inn: [inn, tax_id, tin]
      email: [email, e_mail]
  error:
    container: true
    synonyms: [error, err, failure, error_details]
    children:
      code: [code, error_code, reason, reason_code, type]
      message: [message, msg, description, detail, text, error_message, reason_text]
      details: [details, errors, fields]
  customer:
    container: true
    synonyms: [customer, payer, client, user, sender, buyer]
    children:
      id: [id, customer_id, user_id, client_id]
      email: [email, e_mail]
      phone: [phone, msisdn, mobile]
      ip: [ip, ip_address]
      name: [name, full_name]

# Плоские схемы без контейнера: поля верхнего уровня, принадлежащие requisite/error.
flat:
  requisite:
    # Переключатель способа выплаты на верхнем уровне (confidence exact). Остальные дети requisite (phone,
    # bank_code, card_number, ...) распознаются по children с confidence flat_requisite.
    type: [payment_method, payout_method, method, payment_type, payout_type, transfer_type, destination_type,
           channel, payment_system]
  error:
    code: [error_code, err_code, errorcode, reason_code, fault_code]
    message: [error_message, error_description, error_msg, err_msg, error_text, fault_message]
  # Только в ответах kind error и в payload вебхука (confidence context).
  error_context:
    code: [code]
    message: [message]
  # Скалярное поле error/err (string/integer) -> error.code, а не контейнер.
  scalar_error_is_code: true

# Роли параметров (path/query/header). Совпадение: элемент без "_" — основа токена (любой токен snake_case-имени
# начинается с неё); элемент с "_" — точное имя. Порядок проверки: idempotency_key -> signature -> auth.
parameters:
  idempotency_key: [idempoten, request_id, x_request_id, client_request_id, x_unique_id, unique_id]
  signature: [signature, sign, sig, hmac, checksum, digest, hash, x_hash]
  auth: [auth, authorization, apikey, bearer, x_api_key, api_key, x_token, x_access_token, access_token]

# Единицы суммы: скоринг сигналов (IR_CONTRACT §2.4). Основы без пробела — префикс токена description
# (cent ~ cents, но не percent); основы с пробелом — подстрока текста в нижнем регистре.
money_units:
  minor:
    description_stems: ["копе", kopeck, kopek, cent, minor, smallest, pence, penny, tiyin, kuru, "в центах",
                        "minor unit", "smallest unit"]
    description_weight: 3
    error_example_weight: 3      # JSON-текст любого error-примера операции содержит minor-основу (один раз)
    minimum_multiple_of: 100
    minimum_at_least: 10000
    minimum_weight: 2
  major:
    description_stems: ["рубл", rubl, ruble, major, dollar, euro, hryvn, tenge, fraction, "дробн", "десятичн",
                        "в единицах валюты", "основных единиц", "units of currency", "main units",
                        "с двумя знаками", "two decimal", "decimal places"]
    description_weight: 3
    format_stems: [decimal, money, double, float]   # format суммы
    format_weight: 2
    pattern_stems: ['\.\d{2}', '\.\d{1,2}', '\d+\.\d']  # подстроки pattern суммы
    pattern_weight: 2
    multiple_of_fraction_weight: 2   # multipleOf < 1 (0.01)
    string_type_weight: 1            # type: string у суммы -> строка с десятичной точкой
  minor_threshold: 3
  major_threshold: 2
  # Множитель major -> minor по коду валюты (ISO 4217 exponent); default для неизвестных/неопределённых.
  currency_exponents:
    default: 100
    JPY: 1
    KRW: 1
    VND: 1
    CLP: 1
    ISK: 1
    KWD: 1000
    BHD: 1000
    OMR: 1000
    JOD: 1000
    TND: 1000

# Условная обязательность. Структурно (discriminator / if-then) — высокая уверенность; из текста — W402.
conditional_required:
  confidence:
    discriminator: 0.95
    if_then: 0.95
    description: 0.6
    override: 1.0
  # Regex по description (без учёта регистра); именованные группы when (имя поля-условия) и equals (значение).
  description_patterns:
    - '(?:обязател\p{L}*|required|mandatory|необходим\p{L}*)[,\s:]+(?:для|for|when|if|при|если)\s+[`''"«]?(?<when>[A-Za-z_][A-Za-z0-9_.]*)[`''"»]?\s*(?:==|=|:|equals|is|равн\p{L}*)\s*[`''"«]?(?<equals>[\p{L}\p{N}_.\-]+)[`''"»]?'
    - '(?:only|только)[,\s:]+(?:for|when|if|для|при|если)\s+[`''"«]?(?<when>[A-Za-z_][A-Za-z0-9_.]*)[`''"»]?\s*(?:==|=|:|equals|is|равн\p{L}*)\s*[`''"«]?(?<equals>[\p{L}\p{N}_.\-]+)[`''"»]?'

# Способы выплаты (request_method): enum поля requisite.type, discriminator или ветки oneOf.
request_methods:
  confidence:
    enum: 0.9
    discriminator: 0.95
    one_of: 0.85
    override: 1.0
  # Известные имена способов (для ветвей oneOf без discriminator и токенов пути в волне 4).
  known_methods: [sbp, card, account, iban, wallet, phone, cash, qr, crypto, m2c, c2c, bank, swift, sepa, mobile]

# Вебхук: какие поля payload играют роли события и статуса (приоритет — порядок списка; верхний уровень
# предпочтительнее вложенного; сравнивается последний сегмент пути).
webhook:
  event_field: [event, event_type, event_name, notification_type, type, action, topic]
  status_field: [status, state, payout_status, payment_status, transfer_status, transaction_status, operation_status,
                 new_status, current_status, payout_state, payment_state]
  # Поле payload, содержащее подпись (location: body); совпадение как для parameters.signature.
  signature_field: [signature, sign, sig, hmac, checksum, digest, hash, control_sum]
